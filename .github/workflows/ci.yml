name: quality
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: '0 6 * * 1-5' }]   # drift sensors, outside the change cycle

env:
  CI: 'true'
  BASE_URL: ${{ secrets.BASE_URL }}
  API_URL: ${{ secrets.API_URL }}

jobs:
  stage-1-static:                # seconds; blocks everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run sensors:static

  stage-2-component:             # fast; component exit criterion
    needs: stage-1-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run coverage
      - run: npm run sensors:report
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: component-reports, path: reports/ }

  stage-3-mutation:              # expensive; PR only
    if: github.event_name == 'pull_request'
    needs: stage-2-component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run mutation

  stage-4-contract-integration:  # depends on an environment
    if: github.event_name != 'schedule'
    needs: stage-2-component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=contract --project=integration --pass-with-no-tests
      - run: npm run sensors:report

  stage-5-e2e-a11y:              # most expensive; main only, regression selected by risk
    if: github.ref == 'refs/heads/main'
    needs: stage-4-contract-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=e2e --project=accessibility --pass-with-no-tests --grep "@risk:R-.*"
      - run: npm run sensors:report

  continuous-drift:               # scheduled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with: { path: reports/history.jsonl, key: "history-${{ github.run_id }}", restore-keys: "history-" }
      - run: npm run sensors:drift
